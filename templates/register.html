{% extends "base.html" %}

{% block content %}
<div class="glass-card auth-container">
    <h2 style="text-align: center; margin-bottom: 2rem; font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, var(--secondary-color), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Create Account</h2>
    <div id="error-msg" style="color: #ef4444; margin-bottom: 1rem; text-align: center; display: none;"></div>
    <form id="register-form">
        <div class="input-group">
            <label for="username"><i class="ph ph-user"></i> Username</label>
            <input type="text" id="username" placeholder="Choose a username" required>
        </div>
        <div class="input-group">
            <label for="password"><i class="ph ph-lock-key"></i> Password</label>
            <input type="password" id="password" placeholder="Choose a strong password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            <i class="ph ph-user-plus"></i> Register
        </button>
    </form>
    <p style="text-align: center; margin-top: 2rem; color: var(--text-muted);">
        Already have an account? <a href="/login" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Login here</a>
    </p>
</div>
{% endblock %}
