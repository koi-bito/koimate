{% extends "base.html" %}

{% block content %}
<section class="hero" style="margin-bottom: 3rem;">
    <h1 style="font-size: 4rem;"><i class="ph ph-chart-pie-slice"></i> Analytics Dashboard</h1>
    <p>Track user behavior, interactions, and system performance.</p>
</section>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; margin-bottom: 2.5rem;">
    <div class="chart-container">
        <h3 style="margin-bottom: 1.5rem; color: var(--primary-color); font-weight: 700;"><i class="ph ph-chart-donut"></i> Interactions by Category</h3>
        <canvas id="categoryChart"></canvas>
    </div>
    <div class="chart-container">
        <h3 style="margin-bottom: 1.5rem; color: var(--secondary-color); font-weight: 700;"><i class="ph ph-chart-bar"></i> Action Distribution</h3>
        <canvas id="actionChart"></canvas>
    </div>
</div>

<div class="chart-container" style="max-width: 1000px; margin: 0 auto;">
    <h3 style="margin-bottom: 1.5rem; color: var(--accent-color); font-weight: 700;"><i class="ph ph-trend-up"></i> Interaction Timeline</h3>
    <canvas id="timelineChart"></canvas>
</div>
{% endblock %}
